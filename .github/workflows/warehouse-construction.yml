name: Colheita QA - Construção de armazém isolada
on:
  push:
    branches: ['feature/warehouse-construction']
    paths: ['html5-babylon/**', 'android-test/**', '.github/workflows/warehouse-construction.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: colheita-babylon-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: 1 - Preparar e compilar código
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: html5-babylon
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Testar leitura independente das senhas QA
        working-directory: .
        run: python3 android-test/test-sign-qa.py
      - name: Testar manifesto de atualização QA
        working-directory: .
        run: python3 android-test/test-qa-manifest.py
      - name: Conferir configuração de assinatura QA
        env:
          CV_QA_SIGNING_BUNDLE: ${{ secrets.CV_QA_SIGNING_BUNDLE }}
        run: |
          if [[ -z "$CV_QA_SIGNING_BUNDLE" ]]; then
            echo "::error::Cadastre o segredo CV_QA_SIGNING_BUNDLE nas configurações de Actions do repositório. Nenhum APK temporário será distribuído."
            exit 1
          fi
      - name: Verificar autorização de publicação por canal
        id: release_gate
        working-directory: .
        run: python3 android-test/rc-release-gate.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node22-npm-${{ hashFiles('html5-babylon/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node22-npm-
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Registrar checkpoint imutável por commit
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > efg-commit.txt
          sha256sum dist/index.html dist/game.js package-lock.json efg-commit.txt > efg-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: efg-web-checkpoint
          path: |
            html5-babylon/dist/
            html5-babylon/package-lock.json
            html5-babylon/efg-commit.txt
            html5-babylon/efg-sha256.txt
          retention-days: 14
          if-no-files-found: error
          overwrite: true
  warehouse:
    name: 2 - Teste direcionado do armazém
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: html5-babylon
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: efg-web-checkpoint
          path: html5-babylon
      - name: Conferir commit e integridade do checkpoint
        run: |
          set -euo pipefail
          test "$(cat efg-commit.txt)" = "$GITHUB_SHA"
          sha256sum --check efg-sha256.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node22-npm-${{ hashFiles('html5-babylon/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node22-npm-
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu24-playwright-${{ hashFiles('html5-babylon/package-lock.json') }}
      - name: Preparar dependências Chromium sem feed externo desnecessário
        working-directory: .
        run: |
          python3 android-test/test-browser-apt.py
          sudo python3 android-test/prepare-browser-apt.py --apply
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
      - name: Instalar Chromium e dependências verificadas
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
      - name: Executar testes e registrar capturas
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/cv-babylon.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:warehouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: efg-warehouse-evidence
          path: html5-babylon/qa/
          retention-days: 14
          if-no-files-found: warn
          overwrite: true
  integration:
    name: 3 - Regressão integrada (desktop e Android simulado)
    needs: [build, warehouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: html5-babylon
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: efg-web-checkpoint
          path: html5-babylon
      - name: Conferir commit e integridade do checkpoint
        run: |
          set -euo pipefail
          test "$(cat efg-commit.txt)" = "$GITHUB_SHA"
          sha256sum --check efg-sha256.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node22-npm-${{ hashFiles('html5-babylon/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node22-npm-
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu24-playwright-${{ hashFiles('html5-babylon/package-lock.json') }}
      - name: Preparar dependências Chromium sem feed externo desnecessário
        working-directory: .
        run: |
          python3 android-test/test-browser-apt.py
          sudo python3 android-test/prepare-browser-apt.py --apply
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
      - name: Instalar Chromium e dependências verificadas
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
      - name: Executar testes e registrar capturas
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/cv-babylon.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: efg-integration-evidence
          path: html5-babylon/qa/
          retention-days: 14
          if-no-files-found: warn
          overwrite: true
  apk:
    name: 4 - Compilar, assinar e validar APK
    needs: [build, warehouse, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: html5-babylon
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: efg-web-checkpoint
          path: html5-babylon
      - name: Conferir commit e integridade do checkpoint
        run: |
          set -euo pipefail
          test "$(cat efg-commit.txt)" = "$GITHUB_SHA"
          sha256sum --check efg-sha256.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preparar SDK Android
        working-directory: .
        run: |
          bash -n android-test/prepare-sdk.sh
          bash android-test/prepare-sdk.sh
      - name: Compilar APK experimental offline
        working-directory: .
        run: |
          mkdir -p android-test/app/src/main/assets
          cp html5-babylon/dist/index.html html5-babylon/dist/game.js android-test/app/src/main/assets/
          gradle -p android-test --no-daemon :app:assembleDebug
      - name: Assinar APK QA com certificado permanente
        working-directory: .
        env:
          CV_QA_SIGNING_BUNDLE: ${{ secrets.CV_QA_SIGNING_BUNDLE }}
        run: bash android-test/sign-qa.sh
      - name: Validar pacote, assinatura e conteúdo
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p android-test/qa
          APK=android-test/qa-signed.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee android-test/qa/signature.txt
          grep -Fx "Signer #1 certificate SHA-256 digest: fdefa3921fb2e0010e5f4a677589a7f8f8a450738626caab4c97dc7ad25f6f21" android-test/qa/signature.txt
          grep -Fx "Verified using v2 scheme (APK Signature Scheme v2): true" android-test/qa/signature.txt
          grep -Fx "Number of signers: 1" android-test/qa/signature.txt
          "$TOOLS/aapt" dump badging "$APK" | tee android-test/qa/badging.txt
          grep -F "package: name='br.com.colheitavitural.html5.qa'" android-test/qa/badging.txt
          grep -F "uses-permission: name='android.permission.INTERNET'" android-test/qa/badging.txt
          grep -F "uses-permission: name='android.permission.REQUEST_INSTALL_PACKAGES'" android-test/qa/badging.txt
          unzip -p "$APK" assets/index.html | cmp - html5-babylon/dist/index.html
          unzip -p "$APK" assets/game.js | cmp - html5-babylon/dist/game.js
          cp "$APK" android-test/qa/ColheitaVitural-QA.apk
          cd android-test/qa
          sha256sum ColheitaVitural-QA.apk > SHA256SUMS.txt
          ls -lh ColheitaVitural-QA.apk
          cd ../..
          python3 android-test/qa-manifest.py android-test/qa
      - uses: actions/upload-artifact@v4
        with:
          name: Colheita-Vitural-APK-QA
          path: android-test/qa/
          retention-days: 14
          if-no-files-found: error
          overwrite: true

