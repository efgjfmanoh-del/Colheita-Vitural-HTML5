name: Colheita Babylon - Etapa 1 residencial
on:
  push:
    branches: [main]
    paths: ['html5-babylon/**', 'android-test/**', '.github/workflows/babylon-residence.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: colheita-babylon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: html5-babylon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Testar o motor e registrar capturas
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/cv-babylon.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Colheita-Babylon-Etapa1-QA
          path: html5-babylon/qa/
          retention-days: 3
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Colheita-Babylon-Etapa1-Web
          path: html5-babylon/dist/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preparar SDK Android
        working-directory: .
        run: |
          bash -n android-test/prepare-sdk.sh
          bash android-test/prepare-sdk.sh
      - name: Compilar APK experimental offline
        working-directory: .
        run: |
          mkdir -p android-test/app/src/main/assets
          cp html5-babylon/dist/index.html html5-babylon/dist/game.js android-test/app/src/main/assets/
          gradle -p android-test --no-daemon :app:assembleDebug
      - name: Validar pacote, assinatura e conteúdo
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p android-test/qa
          APK=android-test/app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee android-test/qa/signature.txt
          "$TOOLS/aapt" dump badging "$APK" | tee android-test/qa/badging.txt
          grep -F "package: name='br.com.colheitavitural.html5.qa'" android-test/qa/badging.txt
          if grep -F "uses-permission: name='android.permission.INTERNET'" android-test/qa/badging.txt; then exit 1; fi
          unzip -p "$APK" assets/index.html | cmp - html5-babylon/dist/index.html
          unzip -p "$APK" assets/game.js | cmp - html5-babylon/dist/game.js
          cp "$APK" android-test/qa/ColheitaVitural-Teste-1J2.apk
          cd android-test/qa
          sha256sum ColheitaVitural-Teste-1J2.apk > SHA256SUMS.txt
          ls -lh ColheitaVitural-Teste-1J2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Colheita-Vitural-APK-Teste-1J2
          path: android-test/qa/
          retention-days: 3
          if-no-files-found: error
