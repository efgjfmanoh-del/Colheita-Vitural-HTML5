plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'br.com.colheitavitural.html5.qa'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.colheitavitural.html5.qa'
        minSdk 24
        targetSdk 35
