plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'br.com.colheitavitural.html5.qa'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.colheitavitural.html5.qa'
        minSdk 24
        targetSdk 35
        versionCode 129
        versionName '0.1.29'
    }
    buildTypes { debug { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'androidx.core:core:1.15.0' }
