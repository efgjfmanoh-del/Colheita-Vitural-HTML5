<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Colheita Vitural — Teste 2A · 0.1.18</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#34552c;font:13px system-ui;color:#fff;overscroll-behavior:none;touch-action:none}
#view{width:100%;height:100%;display:block;touch-action:none;outline:none}
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));background:#203221e8;padding:6px 8px;border:1px solid #c4d8a07a;border-radius:10px;max-width:min(330px,calc(100% - 24px))}
#hud-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
#hud strong{color:#f6e6bf;display:block;font-size:12px}
#hud small{color:#d6e5b9}
#metrics{font-variant-numeric:tabular-nums;font-size:10px}
.controls{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
button{border:1px solid #97aa7c;background:#405b39;color:white;border-radius:7px;padding:6px 7px;min-height:32px;font:11px system-ui;touch-action:manipulation}
button:disabled{opacity:.7}button[aria-pressed=true]{background:#d9e5b8;color:#243b2b;border-color:#e7efce;font-weight:600}
#hud-toggle{min-height:28px;padding:3px 8px}
#joy{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:max(22px,env(safe-area-inset-left));width:108px;height:108px;border:2px solid #e4eac783;border-radius:50%;background:#243b2b66;touch-action:none}
#knob{position:absolute;left:31px;top:31px;width:42px;height:42px;border-radius:50%;background:#f5edc0b3;pointer-events:none}
#run-action{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:91px;width:62px;height:62px;border-radius:50%;background:#243b2b9c;border:2px solid #e4eac79c;color:#f5edc0;touch-action:none;font-size:11px;font-weight:700;display:grid;place-items:center;align-content:center;gap:1px;padding:3px}#run-action svg{width:25px;height:25px}#run-action[aria-pressed=true]{background:#d9e5b8;color:#243b2b;border-color:#f6e6bf}
#door-action{touch-action:none;position:fixed;bottom:28px;right:24px;min-height:48px;padding:12px 18px;background:#e7d3a1;color:#243b2b;font-size:15px;font-weight:700;box-shadow:0 3px 12px #0005}
#seat-action{position:fixed;bottom:28px;right:190px;min-height:48px;padding:12px 16px;background:#e7d3a1;color:#243b2b;font-size:15px;font-weight:700;box-shadow:0 3px 12px #0005}
#garden-action{position:fixed;bottom:28px;right:24px;min-height:48px;padding:12px 18px;background:#d9e5b8;color:#243b2b;font-size:15px;font-weight:700}
#garden-panel{position:fixed;right:12px;bottom:12px;max-width:min(350px,calc(100vw - 24px));padding:12px;background:#203221f5;border:1px solid #a4bd86;border-radius:12px;z-index:4}
#garden-panel strong{display:block;color:#f6e6bf;font-size:15px}#garden-state{display:block;margin:6px 0;color:#e5eccf}#garden-species{display:flex;gap:6px;flex-wrap:wrap}#garden-panel button{min-height:36px}
#entry-status{display:block;color:#f6e6bf;font-size:11px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#263d29;z-index:10;text-align:center;padding:20px}
[hidden]{display:none!important}
</style>
</head>
<body><canvas id="view"></canvas>
<div id="hud"><div id="hud-head"><div><strong>COLHEITA VITURAL · 2A · 0.1.18</strong><small><span id="fps">…</span> · <span id="quality-label">Equilibrado</span></small></div><button id="hud-toggle" aria-expanded="true" aria-controls="hud-panel">Painel</button></div>
<div id="hud-panel"><span id="entry-status"></span><small id="metrics">Medindo tempo de quadro…</small>
<div class="controls"><button id="wide">Geral</button><button id="close">Casa</button><button id="follow">Personagem</button><button id="rotate">Girar</button><button id="field-view">Campo</button></div>
<div class="controls" aria-label="Qualidade gráfica"><button id="quality-economico" aria-pressed="false">540p</button><button id="quality-equilibrado" aria-pressed="true">720p</button><button id="quality-alto" aria-pressed="false">1080p</button></div></div></div>
<button id="run-action" aria-label="Segure para correr" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15.6" cy="4.2" r="2"/><path d="m9 10 4-3 3 4 4 1M13 7l-3 7 5 3-2 5M10 14l-3 4H3M8 8l-4 3"/></svg><span>Correr</span></button><button id="seat-action" hidden>Sentar</button><button id="door-action" hidden>Abrir porta</button><button id="garden-action" hidden>Cultivar flores</button><section id="garden-panel" hidden aria-label="Cultivo ornamental"><strong id="garden-title">Vaso</strong><small id="garden-state"></small><div id="garden-species"></div><div class="controls"><button id="garden-remove">Retirar flor</button><button id="garden-close">Voltar ao jogo</button></div><small>Sementes livres neste teste · crescimento inicial em 90 segundos</small></section><div id="joy"><div id="knob"></div></div><div id="loading">Construindo a fazenda…</div>
<script>addEventListener('error',e=>{const el=document.getElementById('loading');if(el)el.textContent='Falha ao iniciar: '+e.message});setTimeout(()=>{const el=document.getElementById('loading');if(el)el.textContent='O motor 3D ainda não iniciou. Verifique o suporte WebGL.'},30000);</script>
<script src="./game.js"></script></body></html>
