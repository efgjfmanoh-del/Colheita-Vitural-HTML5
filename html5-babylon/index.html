<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Colheita Vitural — Estudo 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#34552c;font:14px system-ui;color:#fff}#view{width:100%;height:100%;display:block;touch-action:none;outline:none}#hud{position:fixed;top:12px;left:12px;background:#203221d9;padding:10px 14px;border:1px solid #c4d8a07a;border-radius:12px;max-width:calc(100% - 50px)}#hud strong{color:#f6e6bf;display:block;font-size:15px}#hud small{color:#d6e5b9}button{border:1px solid #97aa7c;background:#405b39;color:white;border-radius:8px;padding:8px;margin:6px 3px 0 0;font:12px system-ui}#joy{position:fixed;bottom:20px;left:22px;width:108px;height:108px;border:2px solid #e4eac783;border-radius:50%;background:#243b2b66;touch-action:none}#knob{position:absolute;left:33px;top:33px;width:42px;height:42px;border-radius:50%;background:#f5edc0b3}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#263d29;z-index:10;text-align:center;padding:20px}</style></head><body><canvas id="view"></canvas><div id="hud"><strong>COLHEITA VITURAL · 3D</strong><small>Etapa 1 · Estudo residencial | <span id="fps">…</span></small><div><button id="wide">Visão geral</button><button id="close">Casa</button><button id="follow">Personagem</button><button id="rotate">Girar câmera</button></div></div><div id="joy"><div id="knob"></div></div><div id="loading">Construindo a fazenda…</div><script>addEventListener('error',e=>{const el=document.getElementById('loading');if(el)el.textContent='Falha ao iniciar: '+e.message});setTimeout(()=>{const el=document.getElementById('loading');if(el)el.textContent='O motor 3D ainda não iniciou. Verifique o suporte WebGL.'},30000);</script><script src="./game.js"></script></body></html>
